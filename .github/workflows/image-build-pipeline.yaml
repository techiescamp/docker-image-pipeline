name: Image Build Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  DEV_REPO: docker.io/devopscube/web-app-dev

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DEV_REPO }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest

      - name: Build and push to dev registry
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=java
          cache-to: type=gha,scope=java,mode=max

      - name: Build summary
        run: |
          echo "=========================================="
          echo " Image pushed to dev registry"
          echo "=========================================="
          echo " Tags   : ${{ steps.meta.outputs.tags }}"
          echo " Digest : ${{ steps.build.outputs.digest }}"
          echo "=========================================="