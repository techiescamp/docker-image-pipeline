name: Promote to Stage

on:
  workflow_dispatch:
    inputs:
      sourceDigest:
        description: "Digest to promote (e.g., sha256:abcd...)"
        required: true

env:
  DEV_REPO: docker.io/devopscube/web-app-dev
  STAGE_REPO: docker.io/devopscube/web-app-stage

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.STAGE_REPO }}
        tags: |
          type=sha,format=short
          type=raw,value=latest

    - name: Setup Trivy
      uses: aquasecurity/setup-trivy@v0.2.0
      with:
        cache: true
        version: v0.69.3

    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@0.33.1
      with:
        scan-type: image
        image-ref: '${{ env.DEV_REPO }}@${{ github.event.inputs.sourceDigest }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        skip-setup-trivy: true

    - name: Install crane
      run: |
        go install github.com/google/go-containerregistry/cmd/crane@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Promote to stage repo
      run: |
        digest="${{ github.event.inputs.sourceDigest }}"

        echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
          echo "Promoting to: $TAG"
          crane copy "${{ env.DEV_REPO }}@$digest" "$TAG"
        done

    - name: Get and print stage image digest
      run: |
        digest=$(crane digest ${{ env.STAGE_REPO }}:latest)
        echo "=========================================="
        echo " Promoted to stage registry"
        echo " Use this digest for promote-to-prod:"
        echo " $digest"
        echo "=========================================="